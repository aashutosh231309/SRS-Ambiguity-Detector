# Alembic configuration. Run from backend/: `alembic upgrade head`.
# NOTE: sqlalchemy.url is intentionally UNSET — env.py resolves the DSN from
# DIRECT_DATABASE_URL (preferred, bypasses Supabase pooler) or DATABASE_URL,
# exactly like the application does. Never put a DSN in this file.
[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
